<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Archive · Carla Budar</title>
    <meta name="description" content="Smaller experiments by Carla Budar: p5.js sketches, electronics, web games and more.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ===== Option A: filterable grid ===== */
        html { scroll-padding-top: calc(8vh + 16px); }
        .arc { background: #F9F7F2; padding: calc(10vh + 84px) 4vw 96px; color: #323F2F; }

        .arc-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 2vw; margin-bottom: 40px; }
        .arc-head h1 { font-size: 3rem; color: #126889; font-weight: 400; } /* matches the homepage section titles */
        .arc-head p { font-size: 1.15rem; font-weight: 400; margin-top: 1.2vh; max-width: 52ch; line-height: 1.5; }
        .arc-count { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: #126889; font-weight: 600; margin-top: 16px; }

        .arc-group + .arc-group { margin-top: 64px; }
        .arc-group-head { display: flex; align-items: baseline; gap: 14px; padding-bottom: 12px; margin-bottom: 28px; border-bottom: 1px solid #AAA7A2; }
        .arc-group-num { font-size: 1rem; color: #126889; font-weight: 500; }
        .arc-group-head h2 { font-size: 2rem; font-weight: 400; }
        .arc-group-count { margin-left: auto; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: #126889; font-weight: 600; }

        .arc-grid { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px 28px; }

        .arc-card { position: relative; display: flex; flex-direction: column; gap: 12px; }
        .arc-thumb { position: relative; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden; background: #AAA7A2; }
        .arc-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 0; display: block; transition: transform 0.5s ease; }
        .arc-year {
            position: absolute; top: 12px; left: 12px;
            background: #F9F7F2; color: #126889; border-radius: 999px;
            padding: 3px 12px; font-size: 0.85rem; font-weight: 500;
        }
        .arc-card:hover .arc-thumb img, .arc-card:focus-within .arc-thumb img { transform: scale(1.06); }

        .arc-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .arc-type { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: #126889; font-weight: 600; }

        .arc-name { font-size: 1.6rem; font-weight: 500; line-height: 1.2; }
        .arc-name a { color: inherit; text-decoration: none; }
        /* whole card clickable, while the demo link stays its own target */
        .arc-name a::after { content: ""; position: absolute; inset: 0; z-index: 1; }
        .arc-card:hover .arc-name, .arc-card:focus-within .arc-name { color: #126889; }

        .arc-summary { font-size: 1rem; font-weight: 400; line-height: 1.5; }

        .arc-tools { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
        .arc-tools li { font-size: 0.85rem; padding: 3px 10px; border: 1px solid #AAA7A2; border-radius: 999px; font-weight: 400; }

        .arc-demo {
            position: relative; z-index: 2; align-self: flex-start;
            font-size: 0.95rem; font-weight: 500; color: #126889; text-decoration: none;
            padding: 6px 14px; border-radius: 999px; border: 1px solid #126889; min-height: 36px;
            display: inline-flex; align-items: center; gap: 6px;
            transition: background-color 0.2s ease;
        }
        .arc-demo:hover, .arc-demo:focus-visible { background: #EDED14; }

        .arc-empty { font-size: 1.1rem; }

        @media (prefers-reduced-motion: reduce) { .arc-thumb img { transition: none; } }

        @media (max-width: 768px) {
            .arc { padding: calc(10vh + 72px) 16px 64px; }
            .arc-head h1 { font-size: 2.2rem; }
            .work-filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; width: 100%; }
            .work-filters button { flex: none; }
            .arc-grid { grid-template-columns: 1fr; gap: 36px; }
            .arc-group + .arc-group { margin-top: 48px; }
            .arc-group-head h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#archive">Skip to the archive</a>
    <div class="page-container">
        <div class="headerPlaceHolder"></div>
        <div class="backBtn"></div>

        <main id="archive" class="arc">
            <div class="arc-head">
                <div>
                    <h1>In My Free Time I Designed...</h1>
                    <p>Smaller experiments outside my main case studies: p5.js sketches, web games, electronics and an early UX concept. Most of them you can try live.</p>
                    <p class="arc-count" aria-live="polite"></p>
                </div>
                <div class="work-filters" role="group" aria-label="Filter archive">
                    <button type="button" data-filter="all" aria-pressed="true">All</button>
                    <button type="button" data-filter="sketch" aria-pressed="false">Code sketches</button>
                    <button type="button" data-filter="web" aria-pressed="false">Website</button>
                    <button type="button" data-filter="ux" aria-pressed="false">UI</button>
                    <button type="button" data-filter="physical" aria-pressed="false">Physical builds</button>
                </div>
            </div>

            <div class="arc-groups"></div>
        </main>

        <div class="footerPlaceholder"></div>
    </div>

    <script src="site.js"></script>
    <script>
        (async function archiveGrid() {
            // Display order of the groups; projects inside each group are newest first.
            const GROUPS = [
                { id: 'sketch',   title: 'Code sketches' },
                { id: 'web',      title: 'Website' },
                { id: 'ux',       title: 'UI' },
                { id: 'physical', title: 'Physical builds' },
            ];
            const groupsEl = document.querySelector('.arc-groups');
            const count = document.querySelector('.arc-count');
            const filters = document.querySelectorAll('.work-filters button');
            const data = await loadProjects();
            const projects = Object.values(data.archive).sort((a, b) => b.year - a.year);

            function card(p) {
                const detail = `project-info.html?project=${encodeURIComponent(p.name)}`;
                const tools = (p.material || []).filter(Boolean).map(t => `<li>${t}</li>`).join('');
                const demo = p.link
                    ? `<a class="arc-demo" href="${p.link}" target="_blank" rel="noopener">${p.linkLabel || 'View live'} <span aria-hidden="true">↗</span><span class="sr-only"> (opens in new tab)</span></a>`
                    : '';
                return `
                    <li class="arc-card">
                        <div class="arc-thumb">
                            <img class="noEnlarge" src="${p.thumb || p.documentation.thumbnail}" alt="" loading="lazy">
                            <span class="arc-year">${p.year}</span>
                        </div>
                        <div class="arc-meta"><span class="arc-type">${p.type || ''}</span></div>
                        <h3 class="arc-name"><a href="${detail}">${p.name}</a></h3>
                        <p class="arc-summary">${p.summary || ''}</p>
                        <ul class="arc-tools" aria-label="Tools">${tools}</ul>
                        ${demo}
                    </li>`;
            }

            function render(filter) {
                let total = 0;
                groupsEl.innerHTML = GROUPS.map((g, i) => {
                    if (filter !== 'all' && filter !== g.id) return '';
                    const items = projects.filter(p => p.category === g.id);
                    if (!items.length) return '';
                    total += items.length;
                    return `
                        <section class="arc-group" aria-labelledby="arc-${g.id}">
                            <div class="arc-group-head">
                                <span class="arc-group-num">${String(i + 1).padStart(2, '0')}</span>
                                <h2 id="arc-${g.id}">${g.title}</h2>
                                <span class="arc-group-count">${items.length} project${items.length === 1 ? '' : 's'}</span>
                            </div>
                            <ul class="arc-grid">${items.map(card).join('')}</ul>
                        </section>`;
                }).join('') || '<p class="arc-empty">Nothing here yet.</p>';
                count.textContent = `${total} project${total === 1 ? '' : 's'}`;
            }

            filters.forEach(button => button.addEventListener('click', () => {
                filters.forEach(b => b.setAttribute('aria-pressed', String(b === button)));
                render(button.dataset.filter);
            }));
            render('all');
        })().catch(err => console.error('archiveGrid', err));
    </script>
</body>
</html>
